<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>HealthSync</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="darkmode.css">

</head>

<body>

<header class="main-header">

<h1>HealthSync</h1>
<p>Your Personal Health Tracker</p>

<button id="darkToggle">🌙 Dark Mode</button>

</header>

<div class="form-container">

<h2>Enter Today's Health Data</h2>

<form id="healthForm">

<label>Age</label>
<input type="number" id="age" required>

<label>Height (cm)</label>
<input type="number" id="height" required>

<label>Weight (kg)</label>
<input type="number" id="weight" required>

<label>Sleep Hours</label>
<input type="number" id="sleep" required>

<label>Water Intake (L)</label>
<input type="number" id="water" required>

<label>Exercise Minutes</label>
<input type="number" id="exercise" required>

<label>Calories Consumed (kcal)</label>
<input type="number" id="calories" required>

<button type="submit">Analyze Health</button>

</form>

</div>

<script src="script.js"></script>
<script src="theme.js"></script>

</body>
</html>
